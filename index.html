
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Classes | Secure Login</title>

  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; }

    body { 
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; 
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://wallpaperaccess.com/full/393735.jpg');
      background-size: cover; background-position: center; background-attachment: fixed;
      padding: 20px;
    }

    .card { 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px);
      padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 400px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
      border: 1px solid rgba(255,255,255,0.1);
      color: white; text-align: center;
    }

    h2 { font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; color: #38bdf8; }
    p { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 30px; }

    .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
    .tab { cursor: pointer; color: rgba(255,255,255,0.4); font-weight: 600; font-size: 15px; position: relative; padding-bottom: 5px; }
    .tab.active { color: #38bdf8; }
    .tab.active::after { content: ''; position: absolute; width: 100%; height: 2px; background: #38bdf8; bottom: 0; left: 0; border-radius: 10px; }

    .form-content { display: none; animation: fadeIn 0.5s ease; }
    .form-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .input-group { margin-bottom: 20px; text-align: left; position: relative; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: rgba(255,255,255,0.8); margin-left: 5px; }
    
    input { 
      width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.08); 
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none;
      font-size: 14px;
    }
    input:focus { border-color: #38bdf8; background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }

    /* Eye Icon Logic */
    .eye-icon {
      position: absolute; right: 15px; top: 38px; cursor: pointer; opacity: 0.6;
    }
    .eye-icon:hover { opacity: 1; }

    .btn { 
      width: 100%; padding: 14px; background: #38bdf8; border: none; color: #0f172a; 
      font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 10px; font-size: 14px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3); background: #7dd3fc; }

    .divider { margin: 25px 0; position: relative; display: flex; align-items: center; gap: 10px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .divider span { font-size: 12px; color: rgba(255,255,255,0.3); }

    .google-btn { 
      width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; 
      font-weight: 500; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 14px;
    }
    .google-btn:hover { background: rgba(255,255,255,1); color: #0f172a; }

    #status { font-size: 13px; margin-bottom: 20px; min-height: 20px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Vector Classes</h2>
  <p>Aim Higher, Learn Smarter</p>
  
  <div class="tabs">
    <div class="tab active" onclick="switchForm('login')" id="loginTab">Login</div>
    <div class="tab" onclick="switchForm('register')" id="regTab">Sign Up</div>
  </div>

  <div id="status"></div>

  <div id="loginForm" class="form-content active">
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="l_email" placeholder="name@email.com">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="l_pass" placeholder="••••••••">
      <span class="eye-icon" onclick="togglePass('l_pass')">👁️</span>
    </div>
    <button class="btn" onclick="login()">Enter Dashboard</button>
    
    <div class="divider"><span>OR</span></div>
    
    <button class="google-btn" onclick="loginWithGoogle()" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; cursor: pointer;">
    
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
    </svg>

    <span style="font-size: 14px; font-weight: 500;">Continue with Google</span>
</button>
  </div>

  <div id="registerForm" class="form-content">
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="r_name" placeholder="John Doe">
    </div>
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="r_email" placeholder="name@email.com">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="r_pass" placeholder="Min 6 characters">
      <span class="eye-icon" onclick="togglePass('r_pass')">👁️</span>
    </div>
    <button class="btn" onclick="register()">Create Account</button>
  </div>
</div>

<script>
  // Firebase Config (Pehle wala hi hai)
  const firebaseConfig = {
    apiKey: "AIzaSyBOqt5Pe6q_hiJbCTly7MQ_8ob4ICyMmx4",
    authDomain: "vector-classes-6c2a7.firebaseapp.com",
    projectId: "vector-classes-6c2a7",
    storageBucket: "vector-classes-6c2a7.appspot.com",
    messagingSenderId: "975898657895",
    appId: "1:975898657895:web:52e4f64e50a45d434840c2"
  };
  
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  // Switch Tab
  function switchForm(type) {
    document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(type + 'Form').classList.add('active');
    document.getElementById(type + 'Tab').classList.add('active');
    document.getElementById('status').innerText = "";
  }

  // Password Show/Hide
  function togglePass(id) {
    const p = document.getElementById(id);
    p.type = p.type === "password" ? "text" : "password";
  }

  // Google Login
  function loginWithGoogle() {
    auth.signInWithPopup(provider)
      .then((res) => window.location.href = "home.html")
      .catch((err) => showError(err.message));
  }

  // Login Email/Pass
  function login() {
    const email = document.getElementById('l_email').value;
    const pass = document.getElementById('l_pass').value;
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => window.location.href = "home.html")
      .catch(err => showError(err.message));
  }

  // Register
  function register() {
    const email = document.getElementById('r_email').value;
    const pass = document.getElementById('r_pass').value;
    auth.createUserWithEmailAndPassword(email, pass)
      .then(() => window.location.href = "home.html")
      .catch(err => showError(err.message));
  }

  function showError(msg) {
    const s = document.getElementById('status');
    s.innerText = msg;
    s.style.color = "#fb7185";
  }
</script>

</body>
</html>
