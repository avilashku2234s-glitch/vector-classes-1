<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Vector Classes</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --blue: #38bdf8; --light: #0f172a; --dark-card: #1e293b; --text-gray: #94a3b8; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--light); color: white; line-height: 1.6; }
        nav { background: var(--dark-card); padding: 0.8rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--blue); }
        nav .logo-area { display: flex; align-items: center; gap: 10px; }
        nav .nav-links { list-style: none; display: flex; gap: 20px; }
        nav a { text-decoration: none; color: white; font-weight: 500; font-size: 14px; transition: 0.3s; }
        nav a:hover { color: var(--blue); }
        .page-header { text-align: center; padding: 50px 20px; background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; }
        .page-header h1 { color: var(--blue); font-size: 2.5rem; margin: 0; }
        .page-header p { color: var(--text-gray); }
        .controls { max-width: 1200px; margin: -30px auto 30px; padding: 20px; background: var(--dark-card); border-radius: 15px; display: flex; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .search-bar { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 50px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .section-title { border-left: 5px solid var(--blue); padding-left: 15px; margin: 40px 0 20px; color: var(--blue); }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .video-card { background: var(--dark-card); border-radius: 15px; overflow: hidden; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); }
        .video-card:hover { transform: translateY(-10px); border-color: var(--blue); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .video-card iframe { width: 100%; border: none; height: 200px; }
        .video-info { padding: 15px; }
        .video-info h3 { font-size: 16px; margin: 0; color: #f1f5f9; }
        .video-info span { font-size: 12px; color: var(--text-gray); }
        footer { text-align: center; padding: 40px; background: #070b14; color: var(--text-gray); margin-top: 50px; }
        @media (max-width: 768px) { .video-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area">
            <img src="vector_classes_logo.jpg" width="45" height="45" style="border-radius: 50%;">
            <span style="font-weight: bold; color: var(--blue);">Vector Classes</span>
        </div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="courses.html" style="color: var(--blue);">Courses</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>Video Lectures</h1>
        <p>Expert Guidance for Class 7th & 8th Students</p>
    </header>

    <div class="container">
        <div class="controls">
            <input type="text" class="search-bar" placeholder="Search for topics..." onkeyup="filterVideos()">
        </div>

        <h2 class="section-title">Mathematics - Class 7</h2>
        <div id="math-grid" class="video-grid">
            </div>

        <h2 class="section-title">Science - Class 8</h2>
        <div id="science-grid" class="video-grid">
            </div>
    </div>

    <footer>
        <p>&copy; 2026 Vector Classes - Quality Education for All</p>
    </footer>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBOqt5Pe6q_hiJbCTly7MQ_8ob4ICyMmx4",
            authDomain: "vector-classes-6c2a7.firebaseapp.com",
            projectId: "vector-classes-6c2a7",
            storageBucket: "vector-classes-6c2a7.appspot.com",
            messagingSenderId: "975898657895",
            appId: "1:975898657895:web:52e4f64e50a45d434840c2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Data Load Function
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const mathGrid = document.getElementById('math-grid');
            const scienceGrid = document.getElementById('science-grid');
            
            mathGrid.innerHTML = '';
            scienceGrid.innerHTML = '';

            snapshot.forEach(doc => {
                const video = doc.data();
                const cardHTML = `
                    <div class="video-card">
                        <iframe src="${video.url}" title="YouTube video"></iframe>
                        <div class="video-info">
                            <h3>${video.title}</h3>
                            <span>${video.class}</span>
                        </div>
                    </div>
                `;

                if(video.class === "Class 7 Maths") {
                    mathGrid.innerHTML += cardHTML;
                } else if(video.class === "Class 8 Science") {
                    scienceGrid.innerHTML += cardHTML;
                }
            });
        });

        function filterVideos() {
            let input = document.querySelector('.search-bar').value.toLowerCase();
            let cards = document.querySelectorAll('.video-card');
            cards.forEach(card => {
                let title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
